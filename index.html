.gsteps{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:12px 0 0;padding:0}
.gsteps li{padding:7px 1px 0;border-top:3px solid var(--line);font-size:11px;line-height:1.35;text-align:center;color:var(--muted)}
.gsteps li b{display:block;font-size:11px;font-variant-numeric:tabular-nums}
.gsteps li[data-state=done]{border-color:color-mix(in oklab,var(--accent) 55%,var(--line));color:var(--text)}
.gsteps li[data-state=active]{border-color:var(--accent);color:var(--accent);font-weight:700}
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tg{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 10px;border:1px solid var(--line);border-radius:9px;font-size:12.5px;font-weight:600;line-height:1.3;cursor:pointer}
.tg input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.tg-box{flex:none;display:grid;place-items:center;width:18px;height:18px;border:1.5px solid var(--muted);border-radius:5px}
.tg-box svg{width:13px;height:13px;fill:none;stroke:var(--bg);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.tg input:checked+.tg-box{background:var(--accent);border-color:var(--accent)}.tg input:checked+.tg-box svg{opacity:1}
.tg:has(input:checked){border-color:color-mix(in oklab,var(--accent) 50%,var(--line))}
.tg:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.panel-foot{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--panel);flex:none}
.count{margin-left:2px;font-size:11px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.steps4 button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:52px;padding:5px 2px;border:1px solid var(--line);border-radius:9px;background:transparent;color:var(--text);font-size:11.5px;font-weight:600;line-height:1.25;text-align:center}
.steps4 b{font-size:13px;color:var(--accent);font-variant-numeric:tabular-nums}
.steps4 button.on{background:var(--accentbg);border-color:var(--accent)}
.guide{margin:11px 0 0;font-size:12px;line-height:1.6;color:var(--muted)}.guide strong{display:block;margin-bottom:2px;font-size:12px;color:var(--accent)}
.pg-note{padding-top:12px}
.lab-more{max-width:1180px;padding:24px 2px 4px}
.lab-more .tray{margin-top:0}.tray-head .amount{margin-left:8px}
.lab-more .scene-caption{font-size:12px;line-height:1.7;margin:14px 0 0;padding:0}
.lab-more .footnote{margin-top:14px}
.shutter{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;animation:shutter .3s ease-out;z-index:5}
.scene .readout{font-variant-numeric:tabular-nums;font-weight:800}
@media(hover:hover) and (pointer:fine){.tool:hover,.btn:not(.primary):hover,.steps4 button:hover,.tg:hover{background:var(--raised)}.seg button:not(.selected):not(:disabled):hover{color:var(--text)}}
/* 탐구 질문 간이 실험 */
.mini .scene{height:clamp(230px,34vh,320px)}
.mini .mini-controls{gap:8px;padding:10px 12px}
.mini .mini-controls .seg{flex:0 1 auto}
.mini .mini-controls .seg button{min-height:34px;font-size:12.5px;padding:4px 10px;border:0}
.mini .mini-controls .btn{min-height:38px;font-size:12.5px;padding:0 12px}
.mini .mini-controls .btn.ghost{margin-left:auto}
.mini-result{font-size:13px;color:var(--text);padding:2px 14px 10px}
/* 이론 드로어 */
dialog.drawer{margin:0 0 0 auto;width:clamp(360px,36vw,500px);max-width:100vw;height:100dvh;max-height:100dvh;border-radius:18px 0 0 18px;border-right:0;animation:drawerIn .28s cubic-bezier(.2,0,0,1)}
dialog.drawer .dialog-body{max-height:calc(100dvh - 66px);padding:18px 22px 30px;scrollbar-width:thin;scrollbar-color:var(--line) transparent;overscroll-behavior:contain}
@keyframes drawerIn{from{transform:translateX(28px);opacity:0}}
dialog.drawer::backdrop{background:#030c1838;backdrop-filter:none}
.th-card{padding:2px 0 18px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.th-card h3{display:flex;align-items:baseline;gap:8px;font-size:16px;line-height:1.4;margin:0 0 10px}
.th-card h3 span{font-size:11px;color:var(--accent);font-variant-numeric:tabular-nums}
.th-fig{margin:0 0 10px;padding:6px;background:var(--stage);border:1px solid var(--line);border-radius:12px;display:grid;place-items:center}
.th-fig svg.scene{width:100%;height:auto;max-height:230px;min-height:0;aspect-ratio:auto}
.dialog-body .th p{font-size:13.5px;line-height:1.7;margin:0 0 8px}
.dialog-body .th .def{color:var(--text);font-size:14px}
.dialog-body .th .link{font-size:12.5px;color:var(--accent);border-left:2px solid var(--accent);padding-left:10px;margin-top:10px}
.th-steps{margin:0 0 8px;padding-left:20px;font-size:13.5px;line-height:1.7}.th-steps li{margin-bottom:3px}
.th-table{width:100%;border-collapse:collapse;font-size:13px;margin:0 0 10px}.th-table th,.th-table td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}.th-table th{font-size:12px;color:var(--muted);font-weight:600}
.th-more{border-bottom:1px solid var(--line)}.th-more summary{min-height:46px;display:flex;align-items:center;font-weight:650;cursor:pointer}.th-more[open] summary{color:var(--accent)}.th-more>p,.th-more>button{margin:0 0 14px}
.keys kbd{margin:0 4px 0 10px}.keys kbd:first-child{margin-left:0}
@media(max-width:1250px){.legend{display:none}.status{--status-h:108px}.lab-scope .status{--status-h:124px}}
@media(max-width:1120px){.lab{grid-template-columns:minmax(0,1fr) 256px;gap:12px 14px}.panel-foot{padding:12px}.panel-foot .btn{padding:0 10px;gap:6px}.tools .tool:not(.capture-btn) span{display:none}.tools .tool:not(.capture-btn){padding:0 10px}.lab-title h1{font-size:22px}}
@media(max-width:860px){.lab{display:block;height:auto;min-height:0}.lab-head{flex-wrap:wrap;align-items:flex-start;margin-bottom:12px}.lab-num{margin-top:5px}.lab-title{flex:1 1 calc(100% - 60px)}.lab-head .head-link{margin-left:48px}.bench{margin-bottom:14px}.stage>svg.scene{position:static;display:block;height:auto;aspect-ratio:1000/580}.status{height:auto;min-height:0}.panel{overflow:visible}.panel-scroll{overflow:visible;background:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 22px;padding-bottom:0}.pg:last-child{border-bottom:1px solid var(--line)}.panel-foot{position:sticky;bottom:0;z-index:4;border-radius:0 0 16px 16px;box-shadow:0 -6px 18px var(--shadow)}.lab-more{padding-top:18px}dialog.drawer{width:min(100vw,520px)}}
@media(max-width:570px){.mini .scene{height:auto;aspect-ratio:700/580}.mini .mini-controls .btn.ghost{margin-left:0}main{padding:14px 10px 16px}.lab-head{gap:8px 10px}.lab-title h1{font-size:21px}.lab-title .subtitle{flex-basis:100%;font-size:12.5px;line-height:1.5;margin-top:2px}.head-meta{display:none}.head-link{font-size:11.5px;padding:5px 11px}.stage>svg.scene[data-narrow]{aspect-ratio:700/580}.bench-head{gap:6px;padding:6px 6px 0 12px;min-height:48px}.live-label span:last-child{display:none}.meter{padding:5px 8px;gap:4px}.meter strong{font-size:13px}.tools .tool{padding:0;width:40px;justify-content:center}.tools .tool span{display:none}.status{padding:9px 12px 11px}.obs{font-size:14px}.explain{font-size:12.5px}.panel-scroll{padding:0 14px}.panel-foot{padding:10px 14px}dialog.drawer{width:100vw;border-radius:0;border:0}dialog.drawer .dialog-body{padding:16px 16px 28px}}
@media(max-width:570px){.meter .opt{display:none}}
@media(prefers-reduced-motion:reduce){dialog.drawer{animation:fadeIn .2s}.tool:active,.seg button:active,.steps4 button:active,.tg:active,.btn:active{transform:none}}
@keyframes fadeIn{from{opacity:0}}
@media(prefers-contrast:more){.bench,.panel,.seg,.tg,.btn,.tool{border-width:2px}.explain,.panel .help{color:var(--text)}}

// 도체·부도체 비교 관찰실. v5부터 다른 세 실험과 같은 실험대 틀(renderLab) 안에서 조작 구획·장면·판독값만 맡는다.
const DEEP_PROTOCOL=[
 ['기준 관찰','대전 전에는?','대전되지 않은 막대를 두고, 자유 전자는 계속 움직이고 묶인 전자는 원자 주변에 머무는지 관찰하세요.'],
 ['가까이 대기','음전하의 영향','같은 거리의 음전하 대전체가 두 물질에 작용합니다. 도체의 전자가 몰리는 쪽과 부도체의 전자 분포를 비교하세요.'],
 ['전하 뒤집기','방향을 예측해요','거리와 대전 정도를 유지하고 양전하로 바꿉니다. 전자의 치우침은 어느 쪽으로 바뀔까요?'],
 ['멀리 떼기','변화가 남을까요?','막대를 멀리하면 전자 분포의 치우침이 줄고, 탄성 지지의 복원력으로 두 물체가 가운데로 돌아옵니다. 전체 전하는 달라졌을까요?']
];
// 참고 출처(사용자 지정): 도체·부도체 화면 머리와 이론 드로어에 표시한다.
const JAVALAB_CI='https://javalab.org/ko/conductor_and_insulator/',JAVALAB_EI='https://javalab.org/ko/electrostatic_induction/';
function deepCredit(){return `<a class="head-link" href="${JAVALAB_CI}" target="_blank" rel="noopener noreferrer" aria-label="참고 출처: 이동준 자바실험실 · 도체와 부도체 (새 창)" title="${JAVALAB_CI}">참고 출처: 이동준 자바실험실 ↗</a>`;}
function deepProtocolBody(s){return `<div class="steps4" role="group" aria-label="실험 순서">${DEEP_PROTOCOL.map((q,i)=>`<button data-deep-step="${i}" aria-pressed="${s.protocolStep===i}" class="${s.protocolStep===i?'on':''}" title="${q[0]} · ${q[1]}"><b>0${i+1}</b><span>${q[0]}</span></button>`).join('')}</div><p class="guide"><strong id="deepStepLabel">자유 탐구</strong><span id="deepInstruction"></span></p>`;}
function deepQuestionBody(){return `<p class="help" style="margin-top:0">전자가 멀리 이동하지 못하는 부도체도 대전체에 끌릴 수 있을까요?</p><button class="btn ghost wide" id="deepQuestionBtn">탐구 질문 08에 답하기 →</button>`;}
function bindDeepLab(s){
 $$('[data-deep-step]').forEach(b=>b.onclick=()=>{
  const i=Number(b.dataset.deepStep),wasPaused=s.paused;s.protocolStep=i;s.paused=false;s.showCharges=true;
  if(i===0){s.sign=0;s.rodMotion=null;s.rod={x:55,y:280};}
  if(i===1){s.sign=-1;startRodMotion(s,{x:s.rod.x<DEEP.x?DEEP.nearLeft:DEEP.nearRight,y:280});}
  if(i===2){s.sign=1;startRodMotion(s,{x:s.rod.x<DEEP.x?DEEP.nearLeft:DEEP.nearRight,y:280});}
  if(i===3)startRodMotion(s,{x:s.rod.x<DEEP.x?55:945,y:280});
  $('#chargeToggle').checked=true;syncPause(s);drawMain();wake();if(wasPaused)toast('움직임을 다시 재생합니다.');

function distanceWord(s){if(s.sign===0)return'';const rel=field(s).p/SF[s.strength];return rel>.6?'가까이':rel>.15?'중간 거리':'멀리';}
function snapCondition(s){const p=[s.sign===0?'대전 전 막대':s.sign<0?'(−) 막대':'(+) 막대'];if(s.sign!==0)p.push(['','약함','중간','강함'][s.strength],distanceWord(s));if(s.kind==='scope'){const q=16-s.electrons;p.push(touching(s)?'손가락 접지 중':q?`처음 검전기 ${q>0?'+':'−'}${Math.abs(q)}`:'중성 검전기');}if(s.fixed)p.push('물체 고정');return p.filter(Boolean).join(' · ');}
function snapResult(s){if(s.kind==='scope'){const n=Math.abs(s.leafNet);return n?`금속박 ${s.leafNet>0?'+':'−'}${n} · 벌어진 각 ≈ ${Math.round(2*s.angle*180/Math.PI)}°`:'금속박 오므라듦';}if(s.kind==='sphere')return s.contact?'막대에 닿아 멈춤':s.pol<.018?'움직임 없음':`기운 각 ≈ ${Math.round(Math.abs(s.theta)*180/Math.PI)}°`;if(s.kind==='can')return s.contact?'막대에 닿아 멈춤':s.pol<.018?'움직임 없음':Math.abs(s.v)>4?'막대 쪽으로 구르는 중':'멈춰 있음';return s.pol<.018?'전자 치우침 없음':'도체는 끝으로 몰림 · 부도체는 궤도만 치우침';}
function addSnap(){if(current==='questions')return;const s=states[current],list=trays[current]||(trays[current]=[]);if(list.length>=3){toast('비교 트레이는 3칸까지예요. 하나를 지우고 담아 주세요.');return}const st=deepCopy(s);st.paused=false;st.demoStage=0;list.push({id:Date.now(),state:st,cond:snapCondition(s),result:snapResult(s)});save('trays',trays);renderTray();toast(`실험대 아래 비교 트레이에 담았어요 (${list.length}/3)`);}
// 썸네일은 기구와 막대 둘레만 잘라 보여 준다(장면 전체를 넣으면 기구가 너무 작다)
function thumbBox(st){const {len}=rodGeom(st),r=st.rod,c=center(st);let x0,x1,y0,y1;if(st.kind==='scope'){x0=Math.min(300,r.x-len/2-20);x1=Math.max(640,r.x+len/2+20);y0=40;y1=580;}else if(st.kind==='sphere'){x0=Math.min(c.x-160,r.x-60);x1=Math.max(c.x+170,r.x+60);y0=60;y1=530;}else if(st.kind==='can'){x0=Math.min(c.x-190,r.x-60);x1=Math.max(c.x+190,r.x+60);y0=130;y1=520;}else{const half=Math.max(260,Math.abs(r.x-DEEP.x)+60);x0=DEEP.x-half;x1=DEEP.x+half;y0=30;y1=580;}x0=Math.max(0,x0);x1=Math.min(1000,x1);return{x:r1(x0),y:y0,w:r1(x1-x0),h:y1-y0};}
function snapThumb(it){if(!thumbCache[it.id]){const st=deepCopy(it.state);st.showTrails=false;const b=thumbBox(st);thumbCache[it.id]=scene(st,'snap'+it.id,true).replace('viewBox="0 0 1000 580"',`viewBox="${b.x} ${b.y} ${b.w} ${b.h}" style="aspect-ratio:${b.w}/${b.h}"`);}return thumbCache[it.id];}
function renderTray(){const host=$('#tray');if(!host)return;const list=trays[current]||[];host.innerHTML=`<div class="tray-head"><span class="section-label" style="margin:0">비교 트레이 <span class="amount">${list.length} / 3</span></span><span class="help" style="margin:0">${list.length?'‘이 조건으로’를 누르면 담아 둔 상태에서 이어서 실험해요.':'조건(전하 종류·대전 정도·거리)을 바꿔 가며 ‘＋ 비교에 담기’를 누르면 결과를 나란히 볼 수 있어요.'}</span></div>${list.length?`<div class="tray-cards">${list.map((it,i)=>`<figure class="tray-card"><div class="tray-thumb">${snapThumb(it)}</div><figcaption><strong>${i+1}. ${esc(it.cond)}</strong><span>→ ${esc(it.result)}</span></figcaption><div class="tray-actions"><button data-snap-load="${it.id}" class="text-button">이 조건으로</button><button data-snap-remove="${it.id}" class="text-button" aria-label="${i+1}번 비교 항목 삭제">✕ 지우기</button></div></figure>`).join('')}</div>`:''}`;
 $$('[data-snap-load]',host).forEach(b=>b.onclick=()=>{const it=list.find(x=>String(x.id)===b.dataset.snapLoad);if(!it)return;states[current]=deepCopy(it.state);renderLab();toast('담아 둔 조건을 실험대에 불러왔어요.')});$$('[data-snap-remove]',host).forEach(b=>b.onclick=()=>{trays[current]=list.filter(x=>String(x.id)!==b.dataset.snapRemove);save('trays',trays);renderTray();});setText($('#snapCount'),list.length?list.length+'/3':'');}
function presetTarget(s,which){const c=center(s),side=s.rod.x<c.x?-1:1;if(s.kind==='scope')return{to:{x:which==='far'?820:which==='side'?clamp(930-s.rod.x,130,870):465,y:76}};if(s.kind==='deep')return{to:{x:which==='side'?(s.rod.x<DEEP.x?DEEP.nearRight:DEEP.nearLeft):which==='near'?(side<0?DEEP.nearLeft:DEEP.nearRight):(side<0?55:945),y:280}};const gap=s.kind==='can'?205:275,y=s.kind==='can'?300:c.y;return{to:{x:which==='side'?clamp(c.x-side*gap,55,945):which==='near'?clamp(c.x+side*gap,55,945):clamp(c.x+side*410,55,945),y},arc:which==='side'};}
function movePreset(s,which){if(s.kind==='deep'&&which==='side'){s.rodMotion=null;s.rod={x:s.rod.x<DEEP.x?DEEP.nearRight:DEEP.nearLeft,y:280};drawMain();wake();return;}const t=presetTarget(s,which);startRodMotion(s,t.to,!!t.arc);wake();}
function setText(el,t){if(el&&el.textContent!==t)el.textContent=t;}
function fitStatus(){const st=$('.status');if(!st||innerWidth<=860)return;const need=st.scrollHeight;if(need>st.clientHeight+1)st.style.setProperty('--status-h',need+'px');}
addEventListener('resize',()=>{const st=$('.status');if(st){st.style.removeProperty('--status-h');fitStatus();}});
function drawMain(){if(current==='questions')return;const s=states[current],host=$('#sceneHost');if(!host)return;const a=document.activeElement,focus=a?.classList?.contains('rod-handle')?'.rod-handle':a?.classList?.contains('ground-hand')?'.ground-hand':'';host.innerHTML=scene(s);bindScene(host,s,drawMain);if(focus)$(focus,host)?.focus({preventScroll:true});setText($('#obs'),observed(s));setText($('#explain'),explanation(s));fitStatus();const m=$('#chargeBalance'),h=meterHTML(s);if(m&&m.dataset.h!==h){m.innerHTML=h;m.dataset.h=h;}syncPanel(s);if(s.kind==='deep')updateDeepReadout(s);}
function wake(){settled=0;if(!raf){lastTime=performance.now();raf=requestAnimationFrame(tick)}}
function tick(t){raf=0;if(current==='questions')return;const dt=Math.min((t-lastTime)/1000,.035);lastTime=t;const moving=step(states[current],dt);drawMain();settled=moving?0:settled+1;if(settled===10||states[current].paused)setText($('#srStatus'),observed(states[current]));if(settled<10&&!states[current].paused)raf=requestAnimationFrame(tick);}
let drag=null;
const ROD_LIMIT={sphere:[55,945,150,364],can:[55,945,140,314],scope:[130,870,62,92],deep:[55,945,235,325]};
function placeRod(s,x,y){stopDemo(s);s.rodMotion=null;const old={...s.rod},L=ROD_LIMIT[s.kind];s.rod.x=clamp(x,L[0],L[1]);s.rod.y=clamp(y,L[2],L[3]);const c=center(s);
 if(s.kind==='sphere'||s.kind==='can'){const rx=s.kind==='sphere'?126:160;if(Math.abs(s.rod.x-c.x)<rx){const choices=[c.x-rx,c.x+rx].filter(v=>v>=L[0]&&v<=L[1]).sort((a,b)=>Math.abs(a-old.x)-Math.abs(b-old.x));s.rod.x=choices[0]??old.x;}}
 if(s.kind==='deep'&&s.rod.x>DEEP.left-64&&s.rod.x<DEEP.right+64)s.rod.x=old.x<DEEP.x?DEEP.left-64:DEEP.right+64;}
function bindScene(host,s,draw){const kick=()=>{draw();if(current!=='questions')wake();else miniWake(host.dataset.q)};const rodEl=$('.rod-handle',host);if(rodEl){rodEl.onpointerdown=e=>{if(e.button!==0)return;e.preventDefault();drag={s,host,draw,pointerId:e.pointerId};host.setPointerCapture?.(e.pointerId);};rodEl.onkeydown=e=>{const d={ArrowLeft:[-14,0],ArrowRight:[14,0],ArrowUp:[0,-14],ArrowDown:[0,14]}[e.key];if(!d)return;e.preventDefault();placeRod(s,s.rod.x+d[0],s.rod.y+d[1]);kick();};}
 host.onpointermove=e=>{if(!drag||drag.host!==host)return;const svg=$('svg.scene',host),p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const loc=p.matrixTransform(svg.getScreenCTM().inverse());placeRod(s,loc.x,loc.y);kick();};host.onpointerup=host.onpointercancel=()=>{drag=null};
 const hand=$('.ground-hand',host);if(hand){hand.onpointerdown=e=>{if(e.button!==0)return;e.preventDefault();toggleGround(s);kick();};hand.onkeydown=e=>{if(e.key!=='Enter'&&e.key!==' ')return;e.preventDefault();toggleGround(s);kick();};}}

 <article class="th-card"><h3><span>01</span>전하는 생기지 않고, 자리만 바뀌어요</h3>${theoryFig('sph','sphere',s=>{s.strength=3;s.rod={x:SPH.px+300,y:SPH.py+SPH.len};},420)}<p class="def">중성 금속에 대전체를 가까이하면 자유 전자가 이동해 <b>가까운 쪽은 대전체와 다른 전하, 먼 쪽은 같은 전하</b>를 띱니다. 이것이 정전기 유도입니다.</p><p>접촉·접지가 없으면 물체 전체의 전하는 그대로 0입니다. + 기호(양전하)는 금속 격자에 고정되어 있고, 자리를 옮기는 것은 −전하를 띤 자유 전자뿐입니다.</p><p class="link">실험 연결 · 금속구와 캔이 끌려온 것은 가까운 쪽이 받는 인력이 먼 쪽이 받는 척력보다 크기 때문이에요.</p></article>

 <article class="th-card"><h3><span>05</span>도체와 부도체 · 전자가 움직일 수 있는 범위</h3>${theoryFig('dp','deep',s=>{s.strength=3;s.rod={x:DEEP.nearLeft,y:280};})}<p class="def">도체에서는 <b>자유 전자가 물체 전체를 이동</b>하고, 부도체에서는 전자가 원자에 묶여 <b>분포만 조금 치우칩니다</b>(유전 분극).</p><p>두 경우 모두 가까운 쪽에 대전체와 다른 전하가 치우치므로 인력이 작용할 수 있습니다. 대전된 풍선에 종잇조각이 끌려오는 것도 이 때문입니다. 부도체의 궤도 그림은 전자 분포를 단순화한 것이며 영구 쌍극자의 회전은 생략했습니다.</p><p class="link">실험 연결 · 도체·부도체 화면의 01~04 순서를 눌러 같은 조건에서 비교해 보세요. 참고: ${credit}</p></article>
 <details class="th-more"><summary>조작 방법과 단축키</summary><p>막대를 끌거나, 막대를 누른 뒤 방향키로 옮깁니다. ‘가까이 가져가기 · 멀리하기 · 반대쪽’ 버튼도 같은 일을 해요. 검전기에서는 화면의 손가락을 누르거나 ‘손가락 대기’ 버튼(G)으로 접지합니다. 실험대 아래 ‘＋ 비교에 담기’로 조건과 결과를 3칸까지 담아 나란히 보고, ‘이 조건으로’를 누르면 그 상태에서 이어서 실험합니다. ‘처음으로’는 지금 실험만 되돌리며 탐구 답안과 비교 트레이는 남습니다.</p><p class="keys"><kbd>F</kbd> 전체화면 <kbd>D</kbd> 테마 <kbd>H</kbd> 이론·도움말 <kbd>R</kbd> 학습 리포트 <kbd>C</kbd> 결과 저장 <kbd>G</kbd> 검전기 접지 <kbd>Esc</kbd> 닫기</p></details>
 <details class="th-more"><summary>모형의 범위</summary><p>이 실험은 <strong>질적 경향을 설명하는 교육용 모형</strong>입니다. 실제 전하량·힘·거리·시간을 측정하지 않습니다. 전하 기호 수는 대표 입자의 수이며 실제 원자 수가 아닙니다. 도체의 표면 전하와 전자 구름은 내부 격자 위의 기호로 단순화했습니다. 자유 전자가 떠도는 속도와 자취는 관찰용입니다. 검전기의 접지는 몸이 지구와 연결된 이상적 조건을 가정하며, 검전기와 지구를 합친 전하는 보존됩니다. 접촉 대전·습도·누설·방전은 포함하지 않습니다.</p></details>
 <details class="th-more"><summary>결과 저장과 학습 기록</summary><p>실험대 오른쪽 위 ‘결과 저장’(카메라) 또는 C 키를 누르면 지금 장면과 조건·결과가 담긴 PNG 한 장이 기기의 다운로드 폴더(iPad는 저장 확인 창)로 저장됩니다. 모범 답안을 열면 처음 답안은 잠기고 아래에 다시 쓰기 칸이 열립니다. 학생 기록은 서버로 보내지 않고 현재 브라우저 세션에서만 쓰며, 테마만 이 기기에 남습니다.</p><button class="btn ghost" id="clearData">모든 학습 데이터 초기화</button></details>
 <details class="th-more"><summary>출처와 제작</summary><p>탐구 활동: 제공된 중학교 과학 교과서 이미지의 금속구·알루미늄 캔·검전기 활동을 재구성했습니다. 교과서 이미지는 재배포하지 않았습니다. 은박지 금속구·플라스틱 막대·알루미늄 캔·검전기·손가락은 제작자가 제공한 그림입니다.</p><p>도체·부도체 참고 출처: ${credit} · <a href="${JAVALAB_EI}" target="_blank" rel="noopener noreferrer" aria-label="이동준 자바실험실 · 정전기 유도 (새 창)">정전기 유도 ↗</a><br>접지 개념: <a href="https://www.physicsclassroom.com/Class/estatics/u8l2b.cfm" target="_blank" rel="noopener noreferrer">The Physics Classroom · Charging by Induction ↗</a><br>도체·부도체 개념 확인: <a href="https://openstax.org/books/college-physics-2e/pages/18-2-conductors-and-insulators" target="_blank" rel="noopener noreferrer">OpenStax · Conductors and Insulators ↗</a></p><p>🧪 송쌤과학 (Song Ssaem Science)<br>ⓒ 2026 송세호 | 아주중학교<br>⚠ 무단 복제·상업적 이용 금지</p><p><strong>버전 v${VERSION}</strong> (${VERSION_DATE}) · 이전 버전은 <code>archive-v4.1</code>·<code>archive-v3</code> 폴더에 보관. v5: 실험대를 화면 높이에 맞춘 새 틀, 장면 바로 아래 ‘지금 관찰’, 조작판 고정 하단, 이론 드로어와 그림, 판독값을 기구 옆으로.</p></details></div>`,{drawer:true});

function withIdentity(callback,allowBlank=false){if(identity&&(allowBlank||(identity.sid&&identity.name)))return callback();openModal('결과에 이름을 남길까요?',`<p>정보는 서버로 전송되지 않아요. 현재 브라우저 세션에서만 사용합니다.</p><div class="two-cols"><label>학번<input type="text" id="studentId" inputmode="numeric" maxlength="20" value="${esc(identity?.sid||'')}"></label><label>이름<input type="text" id="studentName" maxlength="30" value="${esc(identity?.name||'')}"></label></div><div class="dialog-actions">${allowBlank?'<button id="anonymous">이름 없이 저장</button>':''}<button class="primary" id="identityGo">${allowBlank?'저장':'확인하고 계속'}</button></div>`);$$('#studentId,#studentName').forEach(el=>el.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#identityGo').click()}});$('#identityGo').onclick=()=>{const sid=$('#studentId').value.trim(),name=$('#studentName').value.trim();if(!allowBlank&&(!sid||!name)){toast('학번과 이름을 모두 입력해 주세요.');return}identity={sid,name};save('identity',identity);closeModal();callback()};if($('#anonymous'))$('#anonymous').onclick=()=>{identity={sid:'',name:''};save('identity',identity);closeModal();callback()};}
function dateStamp(){const d=new Date(),p=x=>String(x).padStart(2,'0');return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`}
function safeName(s){return String(s||'이름없음').replace(/[\\/:*?"<>|\u0000-\u001f]/g,'_')}
function captureCondition(s){return `${s.sign===0?'대전 전 막대':s.sign<0?'(−) 대전체':'(+) 대전체'} · 대전 정도 ${['','약함','중간','강함'][s.strength]}${s.kind==='scope'?` · ${touching(s)?'손가락 접지 중':'접지 안 함'}`:''}${s.fixed?' · 물체 고정':''} → ${observed(s)}`;}
function captureState(s){if(s.kind==='scope'){const q=16-s.electrons,n=x=>x>0?'+'+x:x<0?'−'+Math.abs(x):'0',r=scopeRegions(s);return `검전기: 양전하 +16, 전자 −${s.electrons} → ${n(q)} (금속판 ${n(r.plate)} · 금속박 ${n(r.leaf)}) · 지구 ${n(-q)} · 합계 0`;}const N=s.kind==='deep'?32:16;return `${experiments[s.kind].title} 전체: 양전하 +${N}, 전자 −${N} → 합계 0 (중성)`;}
async function makeCapture(){if(current==='questions')throw Error('실험대에서 저장해 주세요.');const s=states[current],c=tone(),original=$('#sceneHost svg'),svg=original.cloneNode(true),src=[original,...original.querySelectorAll('*')],dst=[svg,...svg.querySelectorAll('*')];
 src.forEach((n,i)=>{const st=getComputedStyle(n);for(const prop of ['display','visibility','fill','stroke','stroke-width','stroke-dasharray','stroke-linecap','stroke-linejoin','paint-order','font-family','font-size','font-weight','text-anchor','opacity','fill-opacity','stroke-opacity'])dst[i].style.setProperty(prop,st.getPropertyValue(prop));});
 svg.querySelectorAll('style').forEach(x=>x.remove());inlineImages(svg);
 const box=original.getBoundingClientRect(),W=clamp(Math.round(box.width*2),1200,2400),H=Math.round(W*box.height/box.width),k=W/1400,band=Math.round(176*k);svg.setAttribute('width',W);svg.setAttribute('height',H);
 const url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml;charset=utf-8'})),img=new Image();
 try{await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});const canvas=document.createElement('canvas');canvas.width=W;canvas.height=H+band;const ctx=canvas.getContext('2d'),font=(w,px)=>`${w} ${Math.round(px*k)}px 'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif`,L=Math.round(36*k),R=W-L,leftMax=W-L*2-Math.round(330*k);
  ctx.fillStyle=c.stage;ctx.fillRect(0,0,W,H+band);ctx.drawImage(img,0,0,W,H);ctx.fillStyle=c.line;ctx.fillRect(L,H,W-L*2,Math.max(1,Math.round(k)));
  ctx.textBaseline='alphabetic';ctx.textAlign='left';ctx.fillStyle=c.accent;ctx.font=font(700,15);ctx.fillText('실험 결과 · 송쌤과학 가상실험실',L,H+36*k);
  ctx.fillStyle=c.text;ctx.font=font(750,25);ctx.fillText(`${experiments[s.kind].title} · 정전기 유도`,L,H+72*k,leftMax);ctx.font=font(500,18);ctx.fillText(captureCondition(s),L,H+108*k,leftMax);ctx.fillStyle=c.muted;ctx.font=font(500,16);ctx.fillText(captureState(s),L,H+142*k,leftMax);
  ctx.textAlign='right';const who=[identity?.sid,identity?.name].filter(x=>x&&String(x).trim()).join(' ');let y=H+36*k;if(who){ctx.fillStyle=c.text;ctx.font=font(650,17);ctx.fillText(who,R,y);y+=30*k;}ctx.fillStyle=c.muted;ctx.font=font(500,16);ctx.fillText(new Date().toLocaleString('ko-KR'),R,y);ctx.font=font(500,15);ctx.fillText('© 송쌤과학 · @songsamscience',R,H+142*k);
  return await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error('PNG 생성 실패')),'image/png'));}finally{URL.revokeObjectURL(url)}}
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function cleanName(x){return String(x??'').replace(/[\\/:*?"<>|\s\x00-\x1f]/g,'')}
function captureFileName(){return [experiments[current].title,'실험결과',identity?.sid,identity?.name,dateStamp()].map(cleanName).filter(Boolean).join('_')+'.png';}
